access_by_lua_block {
    local jwt = require "resty.jwt"
    local auth_header = ngx.req.get_headers()["Authorization"]

    if auth_header == nil then
        ngx.status = 401
        ngx.header.content_type = "application/json"
        ngx.say('{"error":"Missing Authorization header"}')
        ngx.exit(401)
    end

    local _, _, token = string.find(auth_header, "Bearer%s+(.+)")

    if token == nil then
        ngx.status = 401
        ngx.header.content_type = "application/json"
        ngx.say('{"error":"Invalid Authorization header format"}')
        ngx.exit(401)
    end

    local jwt_obj = jwt:verify(jwt_secrets:get("default"), token)

    if not jwt_obj["verified"] then
        ngx.status = 401
        ngx.header.content_type = "application/json"
        ngx.say(string.format('{"error":"Invalid token", "reason":"%s"}', jwt_obj.reason or "unknown"))
        ngx.exit(401)
    end

    for key, value in pairs(jwt_obj["payload"]) do
        if type(value) == "string" then
            ngx.req.set_header("X-JWT-" .. key, value)
        end
    end
}
